name: Copilot Setup Steps

# Bootstrap environment so GitHub Copilot coding agents (Claude, Codex, etc.)
# can autonomously work on issues and PRs in this repository.
#
# Docs: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

on:
  workflow_dispatch:
  push:
    paths:
      - .github/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Bootstrap metacognition environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install dev/lint tooling
        run: pip install ruff mkdocs mkdocs-material build

      - name: Install package in editable mode
        run: pip install -e .

      - name: Verify package import
        run: python -c "import src; print('metacognition package imported OK')"

      - name: Lint (ruff, errors-only)
        run: ruff check src/ tests/ --select E9,F63,F7,F82

      - name: Run test suite
        run: pytest -q --no-cov
