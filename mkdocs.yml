site_name: "mBFT — Metacognitive Byzantine Fault Tolerance"
site_description: "Reference implementation of the mBFT consensus protocol for multi-agent systems"
site_url: "https://sauravbhattacharya001.github.io/metacognition/"
repo_url: "https://github.com/sauravbhattacharya001/metacognition"
repo_name: "sauravbhattacharya001/metacognition"

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Protocol: protocol.md
  - Architecture: architecture.md
  - Engine Catalog: engines.md
  - API Reference: api.md
