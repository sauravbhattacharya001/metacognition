[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbft-consensus"
version = "0.1.0"
description = "Metacognitive Byzantine Fault Tolerance reference implementation."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pydantic>=2.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
