[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbft-consensus"
version = "0.1.0"
description = "Metacognitive Byzantine Fault Tolerance reference implementation."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pydantic>=2.5"]
readme = "README.md"
authors = [
    {name = "Saurav Bhattacharya", email = "online.saurav@gmail.com"},
]
keywords = [
    "byzantine-fault-tolerance",
    "consensus",
    "metacognition",
    "distributed-systems",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sauravbhattacharya001/metacognition"
Documentation = "https://sauravbhattacharya001.github.io/metacognition/"
Repository = "https://github.com/sauravbhattacharya001/metacognition"
Issues = "https://github.com/sauravbhattacharya001/metacognition/issues"
Changelog = "https://github.com/sauravbhattacharya001/metacognition/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
